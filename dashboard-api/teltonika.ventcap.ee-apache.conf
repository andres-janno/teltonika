<VirtualHost *:80>
    ServerName teltonika.ventcap.ee
    Redirect permanent / https://teltonika.ventcap.ee/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName teltonika.ventcap.ee
    DocumentRoot /var/www/html/teltonika-dashboard
    AddDefaultCharset UTF-8

    <Directory /var/www/html/teltonika-dashboard>
        AuthType Basic
        AuthName "Teltonika"
        AuthUserFile /etc/apache2/.htpasswd-teltonika
        Require valid-user
        Options -Indexes
        AllowOverride None
    </Directory>

    ProxyPass /api/ http://127.0.0.1:8811/api/
    ProxyPassReverse /api/ http://127.0.0.1:8811/api/

    <Location /api>
        AuthType Basic
        AuthName "Teltonika"
        AuthUserFile /etc/apache2/.htpasswd-teltonika
        Require valid-user
    </Location>

    LogLevel warn
    CustomLog /var/log/apache2/teltonika.ventcap.ee_access.log combined
    ErrorLog /var/log/apache2/teltonika.ventcap.ee_error.log

    SSLCertificateFile      /etc/ssl/certs/ventcap-ee.crt
    SSLCertificateKeyFile   /etc/ssl/private/ventcap-ee.key
    SSLCertificateChainFile /etc/ssl/certs/ventcap-ee_ca.crt
    SSLEngine on
    SSLProtocol             all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off
    SSLOptions +StrictRequire
</VirtualHost>
</IfModule>
